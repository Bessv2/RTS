name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Build into a temporary folder
        run: node scripts/build.mjs --out "$RUNNER_TEMP/site"

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright (test-only, not part of the site)
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Make sure generated pages are current
        run: node scripts/build.mjs
      - name: Browser tests
        run: npm run test:e2e
